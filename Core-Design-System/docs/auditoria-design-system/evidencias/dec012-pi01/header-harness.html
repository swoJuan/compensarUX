<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Header B (DEC-012 P3)</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../icons/icons.css">
<style>body{margin:0;padding:0;background:var(--color-surface-page,#fff);} .case{margin:0 0 140px;} .case>h2{font:12px monospace;margin:0 0 4px 4px;color:#888;}</style>
</head>
<body>
<!-- Header a sangre completa (como en un sitio real). Los 6 primeros casos los pinta web-header-docs.js con su build() real. -->
<div data-component-doc="web-header">
  <div class="case"><h2>public</h2><div id="v-public" data-web-header-variant-demo="public"></div></div>
  <div class="case"><h2>dropdown (ancla: 1.er item)</h2><div id="v-dropdown" data-web-header-variant-demo="dropdown"></div></div>
  <div class="case" data-skip-equiv><h2>dropdown (ancla: 3.er item) - caso de mejora, no de equivalencia</h2><div id="v-dropdown-late"></div></div>
  <div class="case"><h2>mobile (drawer abierto)</h2><div id="v-mobile" data-web-header-variant-demo="mobile"></div></div>
  <div class="case"><h2>estado hover</h2><div id="s-hover" data-web-header-state-demo="hover"></div></div>
  <div class="case"><h2>estado focus</h2><div id="s-focus" data-web-header-state-demo="focus"></div></div>
</div>
<div data-component-doc="web-header">
  <div class="case" data-skip-equiv><h2>zt</h2><div id="v-zt" data-web-header-variant-demo="zt"></div></div>
</div>
<script src="../js/web-header-docs.js"></script>
<script>
  // Caso 3.er item: mismo markup del dropdown, pero anclado al tercer item de navegación ("Sedes").
  document.addEventListener('DOMContentLoaded', function () {
    var late = document.getElementById('v-dropdown-late');
    late.innerHTML = document.getElementById('v-dropdown').innerHTML;
    var items = late.querySelectorAll('.mp-web-header__nav-item');
    items[2].appendChild(items[0].querySelector('.mp-web-header__dropdown'));
    // evitar ids duplicados del buscador
    late.querySelectorAll('[id]').forEach(function (n) { n.id = n.id + '-late'; });
    late.querySelectorAll('label[for]').forEach(function (n) { n.htmlFor = n.htmlFor + '-late'; });
  });
</script>
</body>
</html>
